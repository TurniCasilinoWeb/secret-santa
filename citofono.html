<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07030a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Secret Santa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icone/icona-192.png">
<link rel="apple-touch-icon" href="icone/icona-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<script src="app.js"></script>
<title>Secret Santa — Citofono</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: scena fotografica iper-realistica — porta vera che si apre sul corridoio, citofono in ottone fotografico */
:root{
  --bg:#04070e;
  --fg:#f3ead7;
  --gold:#e8b84b;
  --gold-deep:#a97c1f;
  --red:#c1272d;
  --red-glow:rgba(255,60,50,.5);
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--fg); font-family:"Spectral",Georgia,serif; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
/* ===== palcoscenico 9:16 ===== */
/* proporzioni sempre esatte (9:16), così la porta ritagliata combacia con la foto su ogni telefono */
#stage{position:relative; z-index:1; aspect-ratio:9/16; width:min(100%, calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 9 / 16)); height:auto;
  overflow:hidden; border-radius:4px; box-shadow:0 0 60px rgba(0,0,0,.8); transition:transform 2s ease}
#stage.zoom{transform:scale(1.07)}
#stage>img.sfondo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
/* ===== apertura della porta (coordinate misurate sulla foto) ===== */
/* vano: regione delle due ante — mostra il corridoio quando si aprono */
#vano{position:absolute; left:29.4%; top:33.3%; width:43.2%; height:45.4%; overflow:hidden; z-index:1}
#vano img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 100%;
  transform:scale(1.15); transition:transform 2.4s ease}
#stage.aperto #vano img{transform:scale(1)}
#ante{position:absolute; left:29.4%; top:33.3%; width:43.2%; height:45.4%; z-index:2; perspective:1100px}
.anta{position:absolute; top:0; height:100%; width:50%; overflow:hidden;
  transition:transform 1.9s cubic-bezier(.45,.05,.3,1); backface-visibility:hidden}
.anta img{position:absolute; width:462.96%; height:auto; max-width:none; display:block}
#anta-sx{left:0; transform-origin:left center}
#anta-sx img{left:-136.32%; top:-73.39%}
#anta-dx{right:0; transform-origin:right center}
#anta-dx img{left:-236.32%; top:-73.39%}
#stage.aperto #anta-sx{transform:rotateY(-84deg)}
#stage.aperto #anta-dx{transform:rotateY(84deg); transition-delay:.12s}
/* ombra interna mentre si apre */
#vano::after{content:""; position:absolute; inset:0; pointer-events:none; z-index:2;
  box-shadow:inset 0 0 50px rgba(0,0,0,.75); opacity:1; transition:opacity 2s}
#stage.aperto #vano::after{opacity:.25}
/* ===== citofono piccolo sul muro ===== */
#mini-cit{position:absolute; left:84%; top:36.5%; width:13%; z-index:3; cursor:pointer; border:0; padding:0;
  background:none; border-radius:6%/4%; box-shadow:0 0 0 2px rgba(232,184,75,.65), 0 0 22px rgba(232,184,75,.5), 0 6px 14px rgba(0,0,0,.6);
  animation:richiamo 2.6s ease-in-out infinite}
#mini-cit img{width:100%; display:block; border-radius:6%/4%}
#mini-cit:focus-visible{outline:3px solid #fff; outline-offset:3px}
@keyframes richiamo{0%,100%{box-shadow:0 0 0 2px rgba(232,184,75,.65), 0 0 14px rgba(232,184,75,.35), 0 6px 14px rgba(0,0,0,.6)}
  50%{box-shadow:0 0 0 2px rgba(232,184,75,.9), 0 0 34px rgba(232,184,75,.75), 0 6px 14px rgba(0,0,0,.6)}}
#suggerimento{position:absolute; left:56%; top:38%; z-index:3; background:#fdf7e3; color:#241503;
  font-size:clamp(11px,1.6vh,15px); border-radius:12px; padding:6px 10px; box-shadow:0 6px 16px rgba(0,0,0,.5); pointer-events:none;
  transition:opacity .5s}
#suggerimento::after{content:""; position:absolute; right:-7px; top:50%; margin-top:-7px; border:7px solid transparent; border-left-color:#fdf7e3; border-right:none}
#neve{position:absolute; inset:0; z-index:4; pointer-events:none}
#badge{position:absolute; z-index:5; top:10px; left:50%; transform:translateX(-50%);
  font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:rgba(243,234,215,.7);
  border:1px solid rgba(243,234,215,.3); border-radius:999px; padding:3px 12px; background:rgba(4,7,14,.55); white-space:nowrap}
/* ===== modale citofono ===== */
#modale{position:fixed; inset:0; z-index:8; display:grid; place-items:center; background:rgba(2,4,9,.86);
  opacity:0; pointer-events:none; transition:opacity .45s; padding:16px; overflow:auto}
#modale.attivo{opacity:1; pointer-events:auto}
#modale .colonna{display:flex; flex-direction:column; gap:12px; align-items:center; max-height:100%; width:min(88vw,400px)}
#pannello{position:relative; width:100%; container-type:inline-size; border-radius:10px; overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.8)}
#pannello>img{width:100%; display:block}
.targa-nome{position:absolute; width:15.8%; height:4.8%; display:flex; align-items:center; justify-content:center;
  font-family:"Cinzel",serif; font-weight:700; color:#43300e; font-size:3.1cqw; letter-spacing:.04em;
  text-shadow:0 1px 0 rgba(255,255,255,.55); pointer-events:none; line-height:1}
.targa-nome.lungo{font-size:2.3cqw; letter-spacing:.01em}
/* modulo in ottone */
#modulo{width:100%; border-radius:12px; padding:13px 14px 15px; box-sizing:border-box; text-align:center;
  background:linear-gradient(160deg,#caa44e,#9a7a30 55%,#6e521c);
  box-shadow:inset 0 1px 0 rgba(255,246,216,.6), inset 0 -3px 8px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.6); color:#241503}
#modulo p{margin:0 0 9px; font-size:13.5px; font-weight:600}
#modulo input{width:100%; box-sizing:border-box; font-family:"Spectral",serif; font-size:15px;
  border:2px solid #5e461a; border-radius:7px; padding:8px 10px; background:#fdf7e3; color:#241503; text-align:center; margin-bottom:7px}
#modulo input::placeholder{font-size:13px; color:#8d7b50}
#suona{width:100%; cursor:pointer; font-family:"Cinzel",serif; font-weight:900; font-size:16px; letter-spacing:.1em;
  border:2px solid #fff2c9; border-radius:999px; padding:10px 0; color:#2a1502;
  background:linear-gradient(180deg,#ffe9a8,var(--gold) 55%,var(--gold-deep));
  box-shadow:0 0 0 2px var(--gold-deep), 0 4px 10px rgba(0,0,0,.45)}
#suona:active{transform:scale(.97)}
#suona:disabled{cursor:wait; filter:saturate(.6) brightness(.9)}
#suona.attesa::after{content:""; display:inline-block; width:.9em; height:.9em; margin-left:.5em; vertical-align:-.1em;
  border:2px solid #2a1502; border-right-color:transparent; border-radius:50%; animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
#suona:focus-visible,#modulo input:focus-visible,#chiudi:focus-visible{outline:3px solid #241503; outline-offset:2px}
#chiudi{align-self:flex-end; cursor:pointer; background:none; border:1px solid rgba(243,234,215,.5); color:var(--fg);
  border-radius:999px; font-size:13px; padding:4px 12px; font-family:"Spectral",serif}
#modale .colonna.scossa{animation:scossa .5s}
@keyframes scossa{0%,100%{transform:none}20%{transform:translateX(-9px) rotate(-1deg)}40%{transform:translateX(8px) rotate(1deg)}
  60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
/* ===== buttafuori ===== */
#buttafuori{position:fixed; z-index:9; left:50%; bottom:0; transform:translate(-50%,115%); transition:transform .5s cubic-bezier(.2,1.3,.4,1);
  display:flex; flex-direction:column; align-items:center; pointer-events:none}
#buttafuori.su{transform:translate(-50%,6%)}
#fumetto{background:#fdf7e3; color:#241503; font-size:15px; border-radius:14px; padding:9px 14px; max-width:24ch; text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,.5); margin-bottom:8px; position:relative}
#fumetto::after{content:""; position:absolute; bottom:-8px; left:50%; margin-left:-8px; border:8px solid transparent; border-top-color:#fdf7e3; border-bottom:none}
#faccione{width:120px; height:120px; border-radius:50%; display:grid; place-items:center; font-size:72px;
  background:radial-gradient(circle at 35% 30%,#2b3b63,#14203d); border:5px solid var(--red);
  box-shadow:0 0 26px var(--red-glow), inset 0 0 14px rgba(0,0,0,.5)}
/* ===== benvenuto ===== */
#benvenuto{position:fixed; inset:0; z-index:10; display:grid; place-items:center; background:rgba(2,5,12,.88);
  opacity:0; pointer-events:none; transition:opacity .9s 1.6s; text-align:center; padding:24px}
#benvenuto.attivo{opacity:1; pointer-events:auto}
#benvenuto .scatola{max-width:34ch; display:flex; flex-direction:column; gap:14px; align-items:center}
#benvenuto h2{font-family:"Cinzel",serif; color:var(--gold); margin:0; font-size:22px; letter-spacing:.08em}
#benvenuto button{font-family:"Spectral",serif; font-size:15px; cursor:pointer; color:var(--fg);
  background:none; border:2px solid var(--gold); border-radius:999px; padding:.5em 1.6em}
@media (prefers-reduced-motion:reduce){
  .anta,#vano img,#stage,#buttafuori{transition:none}
  #mini-cit{animation:none}
  #modale .colonna.scossa{animation:none}
}
#faccione{background-size:cover; background-position:center}
#sfocato{position:fixed; inset:-40px; z-index:0; background:url("foto/porta.jpg") center/cover; filter:blur(26px) brightness(.4)}
</style>
</head>
<body>

<div id="sfocato"></div>
<main id="stage">
  <img class="sfondo" src="foto/porta.jpg" alt="Ingresso del palazzo di notte">
  <div id="vano"><img src="foto/corridoio.jpg" alt=""></div>
  <div id="ante">
    <div class="anta" id="anta-sx"><img src="foto/porta.jpg" alt=""></div>
    <div class="anta" id="anta-dx"><img src="foto/porta.jpg" alt=""></div>
  </div>
  <button id="mini-cit" aria-label="Apri il citofono"><img src="foto/citofono.jpg" alt=""></button>
  <div id="suggerimento">Suona al citofono 🔔</div>
  <canvas id="neve"></canvas>
</main>

<div id="modale" role="dialog" aria-modal="true" aria-label="Citofono">
  <div class="colonna">
    <button id="chiudi">✕ chiudi</button>
    <div id="pannello">
      <img src="foto/citofono.jpg" alt="Citofono in ottone con otto targhette">
      <!-- targhette: coppia per riga -->
      <div class="targa-nome" style="left:31.3%;top:42.2%">Davide</div>
      <div class="targa-nome lungo" style="left:53.2%;top:42.2%">Angelica</div>
      <div class="targa-nome" style="left:31.3%;top:51.6%">Enza</div>
      <div class="targa-nome" style="left:53.2%;top:51.6%">Daniele</div>
      <div class="targa-nome lungo" style="left:31.3%;top:60.8%">Francesco</div>
      <div class="targa-nome lungo" style="left:53.2%;top:60.8%">Alessandra</div>
      <div class="targa-nome" style="left:31.3%;top:69.9%">Andrea</div>
      <div class="targa-nome" style="left:53.2%;top:69.9%">Chiara</div>
    </div>
    <form id="modulo" novalidate>
      <p>Scrivi il tuo nome utente e la parola d'ordine</p>
      <input id="campo-nome" type="text" placeholder="nome utente" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
      <input id="campo-pass" type="password" placeholder="parola d'ordine" autocomplete="current-password">
      <button id="suona" type="submit">🔔 Citofona</button>
    </form>
  </div>
</div>

<div id="buttafuori" aria-live="polite">
  <div id="fumetto"></div>
  <div id="faccione"></div>
</div>


<script>
// ---- neve sopra la scena ----
const cv=document.getElementById('neve'),cx=cv.getContext('2d');
const stage=document.getElementById('stage');
let W,H,fiocchi=[];
const ridotto=matchMedia('(prefers-reduced-motion: reduce)').matches;
function dimensiona(){W=cv.width=stage.clientWidth;H=cv.height=stage.clientHeight;
  const n=ridotto?0:Math.min(110,Math.floor(W*H/11000));
  fiocchi=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,
    r:.8+Math.random()*2.4,v:.35+Math.random()*1,o:.3+Math.random()*.55,s:Math.random()*6.28}));}
dimensiona();addEventListener('resize',dimensiona);
(function anima(){cx.clearRect(0,0,W,H);cx.fillStyle='#fff';
  for(const f of fiocchi){f.y+=f.v;f.s+=.011;f.x+=Math.sin(f.s)*.45;
    if(f.y>H+4){f.y=-4;f.x=Math.random()*W}
    cx.globalAlpha=f.o;cx.beginPath();cx.arc(f.x,f.y,f.r,0,6.28);cx.fill();}
  cx.globalAlpha=1;requestAnimationFrame(anima);})();

// ---- suoni veri (registrazioni) ----
const sfx={};
function suono(n){try{const a=sfx[n]||(sfx[n]=new Audio('suoni/'+n+'.mp3'));a.currentTime=0;
  const p=a.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}}

// ---- apertura/chiusura modale citofono ----
const modale=document.getElementById('modale');
const colonna=document.querySelector('#modale .colonna');
const sugger=document.getElementById('suggerimento');
document.getElementById('mini-cit').addEventListener('click',()=>{
  modale.classList.add('attivo');
  sugger.style.opacity='0';
  setTimeout(()=>document.getElementById('campo-nome').focus(),450);
});
document.getElementById('chiudi').addEventListener('click',()=>modale.classList.remove('attivo'));

// ---- logica ----
const frasi=['Non ti conosco.','Nome o parola d’ordine sbagliati.','Riprova, con calma.','Da qui non si passa.','Tentativo respinto.'];
const buttafuori=document.getElementById('buttafuori');
const fumetto=document.getElementById('fumetto');
const faccione=document.getElementById('faccione');
const nome=document.getElementById('campo-nome');
const pass=document.getElementById('campo-pass');

// già entrato su questo telefono? si va dritti alla Home
if(SS.sessione())location.replace('home.html');

let inCorso=false;
const bottone=document.getElementById('suona');
// Si entra col pulsante o col tasto "Vai" della tastiera. Mentre lo script risponde
// (la prima volta può impiegare qualche secondo) il pulsante mostra che sta lavorando.
document.getElementById('modulo').addEventListener('submit',async e=>{
  e.preventDefault();
  if(inCorso)return;
  if(!nome.value.trim()||!pass.value){caccia('Scrivi nome utente e parola d’ordine.');return;}
  inCorso=true;
  document.activeElement&&document.activeElement.blur();   // chiude la tastiera
  bottone.disabled=true;bottone.textContent='Sto citofonando…';bottone.classList.add('attesa');
  suono('campanello');
  const attesa=new Promise(r=>setTimeout(r,1300));          // il tempo del ding-dong
  try{ await Promise.all([SS.accedi(nome.value,pass.value),attesa]); bottone.textContent='Porta aperta'; apri(); }
  catch(err){ await attesa; caccia(err.codice==='credenziali'?null:err.message); bottone.textContent='🔔 Citofona'; bottone.disabled=false; }
  finally{ inCorso=false; bottone.classList.remove('attesa'); }
});

function caccia(messaggio){
  suono('ronzatore');
  colonna.classList.remove('scossa');void colonna.offsetWidth;colonna.classList.add('scossa');
  const tutti=SS.dati().partecipanti;
  faccione.style.backgroundImage='url("'+SS.foto(tutti[Math.floor(Math.random()*tutti.length)])+'")';
  fumetto.textContent=messaggio||frasi[Math.floor(Math.random()*frasi.length)];
  buttafuori.classList.add('su');
  setTimeout(()=>buttafuori.classList.remove('su'),2300);
}
function apri(){
  modale.classList.remove('attivo');
  setTimeout(()=>{
    suono('cigolio');
    stage.classList.add('aperto','zoom');
    setTimeout(()=>location.replace('home.html'),2100);   // la porta si apre, si entra in casa
  },500);
}
</script>
</body>
</html>
