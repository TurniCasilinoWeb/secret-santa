<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07030a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Secret Santa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icone/icona-192.png">
<link rel="apple-touch-icon" href="icone/icona-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<script src="app.js"></script>
<title>Secret Santa — Sorteggio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Cinzel:wght@700;900&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: slot natalizia da Las Vegas disegnata su misura — mobile laccato rosso, insegna a lampadine, tre rulli cilindrici 3D a 8 facce, leva vera */
:root{
  --notte:#07030a;
  --vino:#2a0610;
  --lacca:#b3121c;
  --lacca-scura:#5a050b;
  --oro:#f0c35a;
  --oro-scuro:#9c6f1c;
  --avorio:#fbf3df;
  --fg:#fbf1dc;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0; overflow:hidden; color:var(--fg); font-family:"Spectral",Georgia,serif;
  background:radial-gradient(120% 80% at 50% 30%, var(--vino), var(--notte) 70%);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px}
/* luci sfocate di Natale sullo sfondo */
#bokeh{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
#bokeh i{position:absolute; border-radius:50%; filter:blur(10px); opacity:.35; animation:galleggia linear infinite}
@keyframes galleggia{0%{transform:translateY(0)}50%{transform:translateY(-24px)}100%{transform:translateY(0)}}
#neve{position:fixed; inset:0; z-index:1; pointer-events:none}

/* ===== macchina ===== */
/* il mobile (84% della larghezza) sta al centro dello schermo; la leva sporge a destra */
#macchina{position:relative; z-index:2; width:min(90vw, 440px, calc((100dvh - 150px) / 1.2)); container-type:inline-size; translate:8% 0}
#macchina.trema{animation:trema .5s}
@keyframes trema{0%,100%{transform:none}20%{transform:translateX(-1.2cqw) rotate(-.6deg)}40%{transform:translateX(1.1cqw) rotate(.6deg)}60%{transform:translateX(-.6cqw)}80%{transform:translateX(.5cqw)}}
#mobile{position:relative; width:84cqw; filter:drop-shadow(0 3cqw 5cqw rgba(0,0,0,.7))}
/* insegna ad arco */
#insegna{position:relative; height:31cqw; border-radius:42cqw 42cqw 2cqw 2cqw / 24cqw 24cqw 2cqw 2cqw;
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.22), transparent 45%),
    linear-gradient(180deg, #d81e28, var(--lacca) 45%, var(--lacca-scura));
  box-shadow:inset 0 0 0 1.4cqw var(--oro-scuro), inset 0 0 0 1.9cqw #ffe39a, inset 0 -2cqw 4cqw rgba(0,0,0,.45);
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding-top:4cqw}
#insegna h1{font-family:"Limelight","Cinzel",serif; font-weight:400; margin:0; font-size:9.6cqw; line-height:1; letter-spacing:.04em;
  background:linear-gradient(180deg,#fff6d2 10%,var(--oro) 50%,var(--oro-scuro) 85%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 .4cqw 0 #5a3305) drop-shadow(0 0 2.4cqw rgba(255,200,90,.7))}
#insegna p{margin:1.4cqw 0 0; font-family:"Cinzel",serif; font-weight:700; font-size:2.5cqw; letter-spacing:.32em; color:#ffe7a6}
.lampadina{position:absolute; width:2.6cqw; height:2.6cqw; margin:-1.3cqw 0 0 -1.3cqw; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff, #ffd56b 45%, #b8780f 100%); box-shadow:0 0 1.6cqw 0.4cqw rgba(255,210,100,.9);
  animation:rincorsa 1.2s linear infinite}
@keyframes rincorsa{0%,60%{opacity:1}61%,100%{opacity:.18; box-shadow:none}}
#macchina.festa .lampadina{animation:impazzite .16s steps(2) infinite}
@keyframes impazzite{50%{opacity:.15; box-shadow:none}}
/* fascia cromata */
.cromo{height:3cqw; background:linear-gradient(180deg,#f7f7f7,#9aa0a8 40%,#e9ecef 55%,#70767e)}
/* corpo */
#corpo{position:relative; padding:3.4cqw 4cqw 4cqw;
  background:
    linear-gradient(90deg, rgba(0,0,0,.35), transparent 12% 88%, rgba(0,0,0,.35)),
    linear-gradient(180deg, var(--lacca), var(--lacca-scura));
  box-shadow:inset 0 0 0 .9cqw var(--oro-scuro)}
/* finestra dei rulli */
#finestra{position:relative; height:42cqw; border-radius:3cqw; padding:2cqw;
  background:linear-gradient(180deg,#e9ecef,#8d939b 50%,#d9dde1); box-shadow:0 1cqw 2cqw rgba(0,0,0,.5)}
#vano{position:relative; height:100%; border-radius:1.8cqw; background:#120406; display:flex; gap:1.6cqw; padding:0 1.6cqw;
  box-shadow:inset 0 0 3cqw rgba(0,0,0,.9)}
.rullo{position:relative; flex:1; perspective:60cqw; overflow:hidden; border-radius:1cqw;
  background:linear-gradient(90deg,#d8ccb0,var(--avorio) 50%,#d8ccb0)}
.tamburo{position:absolute; left:0; right:0; top:50%; height:0; transform-style:preserve-3d}
.faccia{position:absolute; left:0; right:0; top:-11.5cqw; height:23cqw; backface-visibility:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1cqw;
  background:linear-gradient(90deg,#e4d9bf,var(--avorio) 50%,#e4d9bf); border-top:.25cqw solid rgba(140,100,40,.25)}
.ritratto{width:15cqw; height:15cqw; border-radius:50%; display:grid; place-items:center;
  background:radial-gradient(circle at 38% 32%, #c8242c, #6e0710); box-shadow:inset 0 0 0 .7cqw var(--oro), 0 .5cqw 1cqw rgba(0,0,0,.25);
  font-family:"Limelight",serif; font-size:8.4cqw; color:#ffe6a0; text-shadow:0 .3cqw 0 #4a0408}
.nome{font-family:"Cinzel",serif; font-weight:900; font-size:2.25cqw; letter-spacing:.04em; white-space:nowrap; color:#5b1209; text-transform:uppercase}
/* ombreggiatura del cilindro + riflesso del vetro */
.rullo::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(180deg, rgba(10,2,3,.92) 0%, rgba(10,2,3,.25) 22%, transparent 38%, transparent 62%, rgba(10,2,3,.25) 78%, rgba(10,2,3,.92) 100%)}
#vetro{position:absolute; inset:0; pointer-events:none; border-radius:1.8cqw;
  background:linear-gradient(115deg, rgba(255,255,255,.16) 0 18%, transparent 18% 30%, rgba(255,255,255,.07) 30% 36%, transparent 36%)}
/* linea vincente */
.freccia{position:absolute; top:50%; width:0; height:0; border:2.2cqw solid transparent; margin-top:-2.2cqw}
.freccia.sx{left:-1.6cqw; border-left:2.8cqw solid var(--oro)}
.freccia.dx{right:-1.6cqw; border-right:2.8cqw solid var(--oro)}
#linea{position:absolute; left:1.6cqw; right:1.6cqw; top:50%; height:23cqw; transform:translateY(-50%); border-radius:1cqw;
  pointer-events:none; opacity:0; box-shadow:0 0 0 .5cqw var(--oro), 0 0 4cqw 1cqw rgba(255,200,80,.85)}
#macchina.festa #linea{animation:pulsalinea .5s ease-in-out infinite alternate}
@keyframes pulsalinea{from{opacity:.55}to{opacity:1}}
/* targa */
#targa{margin-top:3cqw; text-align:center; padding:1.8cqw 2cqw; border-radius:1.6cqw; background:linear-gradient(180deg,#1a0b05,#000);
  box-shadow:inset 0 0 0 .4cqw var(--oro-scuro); font-family:"Cinzel",serif; font-weight:900; font-size:3cqw; letter-spacing:.28em; color:var(--oro)}
#targa.avviso{font-family:"Limelight","Cinzel",serif; font-weight:400; font-size:4.4cqw; letter-spacing:.14em; color:#ffd2c8;
  text-shadow:0 0 2cqw rgba(255,60,50,.9); animation:avviso .28s steps(2) 6}
@keyframes avviso{50%{color:#5a1a14; text-shadow:none}}
#macchina.spenta .lampadina{animation:none; opacity:.25; box-shadow:none}
/* vassoio monete */
#vassoio{position:relative; margin:3.4cqw auto 0; width:62cqw; height:11cqw; border-radius:2cqw 2cqw 5cqw 5cqw;
  background:linear-gradient(180deg,#050102,#2a0c0e); box-shadow:inset 0 2cqw 2.6cqw #000, 0 0 0 1cqw #c9ced3, 0 0 0 1.5cqw #6c7279}
#vassoio::before{content:"★"; position:absolute; left:-12cqw; top:2cqw; font-size:6cqw; color:var(--oro); opacity:.85}
#vassoio::after{content:"★"; position:absolute; right:-12cqw; top:2cqw; font-size:6cqw; color:var(--oro); opacity:.85}
#base{height:4cqw; border-radius:0 0 2cqw 2cqw; background:linear-gradient(180deg,#6c7279,#2b2f34)}
/* leva */
#leva{position:absolute; left:84cqw; top:62cqw; width:16cqw; height:0; touch-action:none}
#mozzo{position:absolute; left:-1cqw; top:-5cqw; width:10cqw; height:10cqw; border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ffffff,#a9afb6 45%,#4c5157); box-shadow:0 .8cqw 1.5cqw rgba(0,0,0,.6)}
#asta{position:absolute; left:2.6cqw; bottom:0; width:2.8cqw; height:34cqw; transform-origin:50% 100%; border-radius:1.4cqw;
  background:linear-gradient(90deg,#6d737a,#f4f6f8 40%,#9aa0a7 60%,#5a5f66); transform:scaleY(calc(1 - 1.85 * var(--p,0)))}
#pomello{position:absolute; left:-1.6cqw; width:11cqw; height:11cqw; border-radius:50%; cursor:grab; touch-action:none;
  top:calc(-34cqw * (1 - 1.85 * var(--p,0)) - 5.5cqw);
  background:radial-gradient(circle at 34% 28%, #ff9a9a, #e0141e 35%, #6e0308 85%); box-shadow:0 1cqw 2cqw rgba(0,0,0,.6), inset -1cqw -1cqw 2cqw rgba(0,0,0,.35)}
#pomello:active{cursor:grabbing}
#pomello:focus-visible{outline:3px solid #fff; outline-offset:3px}
#macchina:not(.usata) #pomello{animation:invito 1.6s ease-in-out infinite}
@keyframes invito{0%,100%{box-shadow:0 1cqw 2cqw rgba(0,0,0,.6), 0 0 0 0 rgba(255,215,120,.0)}50%{box-shadow:0 1cqw 2cqw rgba(0,0,0,.6), 0 0 0 2cqw rgba(255,215,120,.35)}}

/* ===== comandi sotto ===== */
#comandi{position:relative; z-index:2; width:min(94vw,420px); text-align:center; transition:opacity .5s}
#tira{width:100%; font-family:"Limelight","Cinzel",serif; font-size:clamp(18px,5.4vw,24px); letter-spacing:.08em; cursor:pointer; color:#3a1700;
  border:0; border-radius:999px; padding:14px 18px;
  background:linear-gradient(180deg,#fff1bd,var(--oro) 50%,var(--oro-scuro)); box-shadow:0 0 0 3px #ffe7a6, 0 0 30px rgba(255,190,80,.55), 0 10px 20px rgba(0,0,0,.6)}
#tira:active{transform:scale(.97)}
#tira:focus-visible{outline:3px solid #fff; outline-offset:4px}
#comandi p{margin:8px 0 0; font-size:13px; opacity:.75}
body.gira #comandi{opacity:0; pointer-events:none}

/* ===== rivelazione ===== */
#rivela{position:fixed; inset:0; z-index:6; display:grid; place-items:center; padding:24px; opacity:0; pointer-events:none; transition:opacity .8s;
  background:radial-gradient(circle at 50% 42%, rgba(60,10,16,.75), rgba(5,2,4,.96) 70%)}
#rivela.attivo{opacity:1; pointer-events:auto}
#raggi{position:absolute; left:50%; top:40%; width:170vmax; height:170vmax; margin:-85vmax 0 0 -85vmax; pointer-events:none; opacity:.55;
  background:repeating-conic-gradient(from 0deg, rgba(255,205,100,.32) 0 6deg, transparent 6deg 18deg);
  -webkit-mask:radial-gradient(circle, #000 0, transparent 55%); mask:radial-gradient(circle, #000 0, transparent 55%);
  animation:ruota 30s linear infinite}
@keyframes ruota{to{transform:rotate(360deg)}}
#carta{position:relative; text-align:center; max-width:380px; width:100%}
#carta .etich{font-family:"Cinzel",serif; font-weight:700; font-size:13px; letter-spacing:.34em; text-transform:uppercase; color:var(--oro); margin:0;
  opacity:0; transform:translateY(10px); transition:all .8s .3s}
#gigante{width:min(58vw,230px); aspect-ratio:1; margin:18px auto 14px; border-radius:50%; display:grid; place-items:center;
  background:radial-gradient(circle at 38% 32%, #d4242d, #6e0710); font-family:"Limelight",serif; font-size:min(30vw,120px); color:#ffe6a0;
  text-shadow:0 4px 0 #4a0408; box-shadow:inset 0 0 0 8px var(--oro), 0 0 0 4px #fff2c4, 0 0 60px rgba(255,200,90,.7);
  transform:scale(.2) rotate(-25deg); transition:transform 1s cubic-bezier(.2,1.5,.4,1)}
#nome-grande{font-family:"Limelight","Cinzel",serif; font-size:clamp(40px,13vw,64px); margin:0; line-height:1;
  background:linear-gradient(180deg,#fff6d2 10%,var(--oro) 55%,var(--oro-scuro) 90%); -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 3px 0 #5a3305) drop-shadow(0 0 18px rgba(255,200,90,.55))}
#nome-grande span{display:inline-block; opacity:0; transform:translateY(-40px) scale(1.4);
  background:linear-gradient(180deg,#fff6d2 10%,var(--oro) 55%,var(--oro-scuro) 90%); -webkit-background-clip:text; background-clip:text; color:transparent}
#rivela.attivo #nome-grande span{animation:lettera .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes lettera{to{opacity:1; transform:none}}
#segreto{margin:14px 0 0; font-style:italic; font-size:15.5px; opacity:0; transition:opacity .8s 1.6s}
#rivela.attivo #segreto,#rivela.attivo .etich{opacity:.92; transform:none}
#rivela.attivo #gigante{transform:none}
#home{margin-top:22px; font-family:"Limelight","Cinzel",serif; font-size:18px; letter-spacing:.06em; cursor:pointer; color:#3a1700; border:0;
  border-radius:999px; padding:12px 30px; background:linear-gradient(180deg,#fff1bd,var(--oro) 50%,var(--oro-scuro)); box-shadow:0 0 0 3px #ffe7a6, 0 8px 18px rgba(0,0,0,.6);
  opacity:0; transition:opacity .8s 2s}
#rivela.attivo #home{opacity:1}
/* comandi anteprima, discreti */
#anteprima{position:fixed; z-index:9; top:calc(env(safe-area-inset-top,0px) + 8px); right:max(10px,env(safe-area-inset-right,0px));
  display:flex; gap:6px}
#anteprima button{font-family:"Spectral",serif; font-size:11.5px; cursor:pointer; color:rgba(251,241,220,.8); background:rgba(7,3,10,.6);
  border:1px solid rgba(251,241,220,.28); border-radius:999px; padding:5px 10px}
#coriandoli{position:fixed; inset:0; z-index:7; pointer-events:none}
@media (prefers-reduced-motion:reduce){
  .lampadina,#macchina.festa .lampadina,#raggi,#pomello{animation:none}
  #nome-grande span{opacity:1; transform:none}
}
.ritratto,#gigante{background-size:cover; background-position:center}
#torna{position:fixed; z-index:20; top:calc(env(safe-area-inset-top,0px) + 10px); left:max(10px,env(safe-area-inset-left,0px)); font-family:Georgia,serif; font-size:13px; color:#fbf1dc; text-decoration:none; background:rgba(10,4,4,.62); border:1px solid rgba(251,241,220,.35); border-radius:999px; padding:6px 12px; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
#torna:focus-visible{outline:3px solid #ffd98a; outline-offset:2px}
</style>
</head>
<body>
<a id="torna" href="home.html">← Home</a>

<div id="bokeh"></div>
<canvas id="neve"></canvas>


<div id="macchina">
  <div id="mobile">
    <div id="insegna">
      <h1>Secret Santa</h1>
      <p>Natale 2026</p>
    </div>
    <div class="cromo"></div>
    <div id="corpo">
      <div id="finestra">
        <div id="vano">
          <div class="rullo"><div class="tamburo"></div></div>
          <div class="rullo"><div class="tamburo"></div></div>
          <div class="rullo"><div class="tamburo"></div></div>
          <div id="vetro"></div>
          <div id="linea"></div>
        </div>
        <div class="freccia sx"></div><div class="freccia dx"></div>
      </div>
      <div id="targa">8 facce · 1 destino</div>
      <div id="vassoio"></div>
    </div>
    <div id="base"></div>
  </div>
  <div id="leva">
    <div id="asta"></div>
    <div id="mozzo"></div>
    <div id="pomello" role="button" tabindex="0" aria-label="Tira la leva"></div>
  </div>
</div>

<div id="comandi">
  <button id="tira">Tira la leva</button>
  <p id="sottotitolo">Un attimo, sto chiedendo alla sorte…</p>
</div>

<div id="rivela" role="dialog" aria-modal="true" aria-labelledby="nome-grande">
  <div id="raggi"></div>
  <div id="carta">
    <p class="etich" id="etich">Devi fare il regalo a</p>
    <div id="gigante">C</div>
    <p id="nome-grande">Chiara</p>
    <p id="segreto">Tienilo per te fino alla fine del Fanta-Santa.</p>
    <button id="home">Torna alla Home</button>
  </div>
</div>
<canvas id="coriandoli"></canvas>

<script>
// ===== partecipanti (coppie ipotizzate nell'ordine fornito) =====
// ===== partecipanti e destinatario: deciso una volta sola dallo script del foglio =====
const io=SS.richiediAccesso();
const P=SS.dati().partecipanti;
let bersaglio=null;                                   // arriva dallo script
const ridotto=matchMedia('(prefers-reduced-motion: reduce)').matches;

// ===== sfondo: luci sfocate e neve =====
const bok=document.getElementById('bokeh');
const tinte=['#ff3b3b','#ffcf5a','#3bd16f','#ff8a3d','#fff2c4'];
for(let i=0;i<22;i++){const b=document.createElement('i');const s=20+Math.random()*90;
  Object.assign(b.style,{width:s+'px',height:s+'px',left:Math.random()*100+'%',top:Math.random()*100+'%',
    background:tinte[i%tinte.length],animationDuration:(6+Math.random()*8)+'s',animationDelay:(-Math.random()*8)+'s'});bok.appendChild(b);}
const nv=document.getElementById('neve'),nx=nv.getContext('2d');let fio=[];
function dimN(){nv.width=innerWidth;nv.height=innerHeight;fio=Array.from({length:ridotto?0:50},()=>({x:Math.random()*nv.width,y:Math.random()*nv.height,r:.6+Math.random()*1.8,v:.3+Math.random()*.6,s:Math.random()*6}))}
dimN();addEventListener('resize',dimN);
(function an(){nx.clearRect(0,0,nv.width,nv.height);nx.fillStyle='rgba(255,255,255,.55)';
  fio.forEach(f=>{f.y+=f.v;f.s+=.01;f.x+=Math.sin(f.s)*.3;if(f.y>nv.height)f.y=-4;nx.beginPath();nx.arc(f.x,f.y,f.r,0,6.3);nx.fill()});requestAnimationFrame(an)})();

// ===== lampadine lungo l'arco dell'insegna =====
const insegna=document.getElementById('insegna');
function lampadine(){
  insegna.querySelectorAll('.lampadina').forEach(l=>l.remove());
  const N=26;
  for(let i=0;i<N;i++){
    const t=Math.PI*(1-i/(N-1));                       // da sinistra a destra lungo l'arco
    const x=50+46*Math.cos(t), y=56-50*Math.sin(t);    // ellisse in percentuale
    const l=document.createElement('span');l.className='lampadina';
    l.style.left=x+'%';l.style.top=y+'%';l.style.animationDelay=(-(i%4)*0.3)+'s';
    insegna.appendChild(l);
  }
}
lampadine();

// ===== rulli cilindrici: 8 facce a 45° =====
const tamburi=[...document.querySelectorAll('.tamburo')];
const PASSO=45;
function raggio(){return document.querySelector('.rullo').getBoundingClientRect().width>0
  ? document.getElementById('macchina').getBoundingClientRect().width*0.23/2/Math.tan(Math.PI/8) : 100}
let R=100;
function costruisci(){
  R=raggio();
  tamburi.forEach((t,k)=>{
    t.innerHTML='';
    for(let i=0;i<8;i++){
      const f=document.createElement('div');f.className='faccia';
      f.innerHTML='<div class="ritratto"></div><div class="nome">'+P[i]+'</div>';
      f.querySelector('.ritratto').style.backgroundImage='url("'+SS.foto(P[i])+'")';
      f.style.transform='rotateX('+(i*PASSO)+'deg) translateZ('+R+'px)';
      t.appendChild(f);
    }
  });
}
const angolo=[0,0,0];
const partenza=[2,5,7];                                 // facce iniziali diverse per ogni rullo
function disegna(k){tamburi[k].style.transform='translateZ(-'+R+'px) rotateX('+angolo[k]+'deg)';}
function posa(k,idx){angolo[k]=-idx*PASSO;disegna(k);}
costruisci();partenza.forEach((idx,k)=>posa(k,idx));
addEventListener('resize',()=>{costruisci();[0,1,2].forEach(disegna);});

// ===== motore audio con registrazioni vere =====
const FILE=['tic','stop','leva','rivela','campanella','monete','sacco','folla','musica','ritenta','delusione'];
let ac=null; const buf={}; const grezzi={};
FILE.forEach(n=>fetch('suoni/'+n+'.mp3').then(r=>r.arrayBuffer()).then(b=>{grezzi[n]=b;if(ac)decodifica(n);}).catch(()=>{}));
function decodifica(n){const b=grezzi[n];if(!b||buf[n])return;grezzi[n]=null;
  ac.decodeAudioData(b).then(d=>buf[n]=d).catch(()=>{});}
function sblocca(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
    FILE.forEach(decodifica);}
  if(ac.state==='suspended')ac.resume();
}
function suona(n,{vol=1,vel=1,ritardo=0}={}){
  if(!ac||!buf[n])return null;
  const s=ac.createBufferSource(),g=ac.createGain();
  s.buffer=buf[n];s.playbackRate.value=vel;g.gain.value=vol;
  s.connect(g).connect(ac.destination);s.start(ac.currentTime+ritardo);
  return {s,g};
}
function sfuma(h,dopo,durata=1.5){if(!h)return;const t=ac.currentTime+dopo;
  h.g.gain.setValueAtTime(h.g.gain.value,t);h.g.gain.linearRampToValueAtTime(0.0001,t+durata);h.s.stop(t+durata+.05);}
let ultimoTic=0;
function tic(forza){const ora=performance.now();if(ora-ultimoTic<38)return;ultimoTic=ora;
  suona('tic',{vol:.25+.55*forza,vel:.92+Math.random()*.16});}

// ===== leva trascinabile =====
const macchina=document.getElementById('macchina');
const leva=document.getElementById('leva'),pomello=document.getElementById('pomello');
let p=0,trascina=null,inCorso=false,fatto=false;
function setP(v){p=Math.max(0,Math.min(1,v));leva.style.setProperty('--p',p);}
function molla(da,a,ms,poi){const t0=performance.now();
  (function f(t){const k=Math.min(1,(t-t0)/ms);const e=a<da?1-Math.pow(1-k,3):1-Math.pow(1-k,2);
    setP(da+(a-da)*e);if(k<1)requestAnimationFrame(f);else poi&&poi();})(t0);}
pomello.addEventListener('pointerdown',e=>{if(inCorso||fatto||bersaglio===null)return;sblocca();trascina={y:e.clientY,p0:p};pomello.setPointerCapture(e.pointerId);});
pomello.addEventListener('pointermove',e=>{if(!trascina)return;
  const corsa=macchina.getBoundingClientRect().width*0.5;setP(trascina.p0+(e.clientY-trascina.y)/corsa);});
pomello.addEventListener('pointerup',()=>{if(!trascina)return;trascina=null;
  if(p>.55){molla(p,1,120,()=>{avvia();molla(1,0,650);});}else molla(p,0,300);});
pomello.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tiraTutto();}});
function tiraTutto(){if(inCorso||fatto||bersaglio===null)return;sblocca();molla(0,1,260,()=>{avvia();molla(1,0,650);});}
document.getElementById('tira').addEventListener('click',tiraTutto);

// ===== tentativi: il tris arriva alla 2ª o 3ª tirata =====
let tentativo=0, totale=2+(Math.random()<.5?1:0);
function esitoPerdente(quasi){
  const caso=()=>Math.floor(Math.random()*8);
  if(quasi){                                          // due uguali, il terzo scivola via di una faccia
    const q=caso();return [q,q,(q+1)%8];
  }
  let e;do{e=[caso(),caso(),caso()];}while(e[0]===e[1]&&e[1]===e[2]);
  return e;
}

// ===== giro dei rulli =====
function avvia(){
  if(inCorso)return;inCorso=true;macchina.classList.add('usata');document.body.classList.add('gira');
  macchina.classList.remove('spenta');
  const targa=document.getElementById('targa');targa.classList.remove('avviso');targa.textContent='8 facce · 1 destino';
  suona('leva',{vol:.9});
  macchina.classList.remove('trema');void macchina.offsetWidth;macchina.classList.add('trema');
  tentativo++;
  const vince=tentativo>=totale;
  const quasi=!vince && tentativo===totale-1 && Math.random()<.75;
  const esiti=vince?[bersaglio,bersaglio,bersaglio]:esitoPerdente(quasi);
  const durate=vince?[2300,3300,5600]:quasi?[1700,2400,5000]:[1700,2400,3200];
  const potenze=vince?[3,3,5.2]:quasi?[3,3,5.2]:[3,3,3.4];
  const giri=vince?[5,7,10]:[4,5,7];
  let fermi=0;
  [0,1,2].forEach(k=>{
    const a0=angolo[k];
    // angolo finale: esito del rullo, sempre in avanti (verso il basso) di almeno N giri
    let fine=-(esiti[k]*PASSO) - giri[k]*360;
    while(fine>a0-giri[k]*360)fine-=360;
    const t0=performance.now()+120+k*90;
    let ultimoScatto=Math.floor(-a0/PASSO);
    // piccolo contraccolpo verso l'alto prima di partire
    (function giro(t){
      if(t<t0){angolo[k]=a0+8*Math.min(1,(t-(t0-120))/120);disegna(k);requestAnimationFrame(giro);return;}
      const x=Math.min(1,(t-t0)/durate[k]);
      const e=1-Math.pow(1-x,potenze[k]);
      angolo[k]=a0+8+(fine-a0-8)*e;disegna(k);
      const scatto=Math.floor(-angolo[k]/PASSO);
      if(scatto!==ultimoScatto){ultimoScatto=scatto;const vel=1-e;tic(Math.min(1,.35+vel*1.2));}
      if(x<1)requestAnimationFrame(giro);
      else{
        rimbalzo(k,fine);
        suona('stop',{vol:.9,vel:k===2?.9:1});
        if(++fermi===3)setTimeout(()=>vince?jackpot():perdita(quasi),380);
      }
    })(performance.now());
  });
}
const frasiRitenta=['Niente da fare. Riprova.','Nessun tris. Tira di nuovo.','Non è ancora il momento.'];
const frasiQuasi=['Per un soffio. Ancora una.','Quasi. Tira di nuovo.'];
function perdita(quasi){
  const targa=document.getElementById('targa');
  targa.textContent=quasi?'Quasi!':'Ritenta!';targa.classList.add('avviso');
  macchina.classList.add('spenta');
  if(quasi){const d=suona('delusione',{vol:.6});sfuma(d,1.6,1.2);}
  else suona('ritenta',{vol:.75});
  const lista=quasi?frasiQuasi:frasiRitenta;
  document.getElementById('sottotitolo').textContent=lista[Math.floor(Math.random()*lista.length)];
  document.getElementById('tira').textContent='Tira ancora';
  setTimeout(()=>{
    macchina.classList.remove('spenta','usata');
    document.body.classList.remove('gira');
    inCorso=false;
  },1500);
}
function rimbalzo(k,fine){const t0=performance.now();
  (function b(t){const x=Math.min(1,(t-t0)/320);angolo[k]=fine+Math.sin(x*Math.PI)*-5*(1-x);disegna(k);if(x<1)requestAnimationFrame(b);})(t0);}

// ===== jackpot =====
const cv=document.getElementById('coriandoli'),cx=cv.getContext('2d');let pezzi=[],vivo=false;
function dimC(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
dimC();addEventListener('resize',dimC);
const colori=['#e0141e','#f0c35a','#1f9a4c','#ffffff','#ffd98a'];
function monete(n){const v=document.getElementById('vassoio').getBoundingClientRect();
  for(let i=0;i<n;i++)pezzi.push({m:1,x:v.left+v.width*(.15+Math.random()*.7),y:v.top+v.height*.4,vx:(Math.random()-.5)*6,vy:-6-Math.random()*7,
    r:6+Math.random()*5,a:Math.random()*6,va:.1+Math.random()*.3,vita:0});go();}
function coriandoli(n){for(let i=0;i<n;i++)pezzi.push({m:0,x:innerWidth*(.1+Math.random()*.8),y:-20-Math.random()*innerHeight*.3,vx:(Math.random()-.5)*3,
  vy:2+Math.random()*3,r:4+Math.random()*4,a:Math.random()*6,va:(Math.random()-.5)*.3,c:colori[i%colori.length],vita:0,o:Math.random()*6});go();}
function go(){if(!vivo){vivo=true;requestAnimationFrame(passo);}}
function passo(){cx.clearRect(0,0,innerWidth,innerHeight);
  pezzi.forEach(q=>{q.vita++;
    if(q.m){q.vy+=.38;q.x+=q.vx;q.y+=q.vy;q.a+=q.va;
      cx.save();cx.translate(q.x,q.y);cx.scale(Math.abs(Math.cos(q.a))+.12,1);
      const g=cx.createRadialGradient(-q.r*.3,-q.r*.3,1,0,0,q.r);g.addColorStop(0,'#fff3c4');g.addColorStop(.5,'#f0c35a');g.addColorStop(1,'#9c6f1c');
      cx.fillStyle=g;cx.beginPath();cx.arc(0,0,q.r,0,6.3);cx.fill();cx.strokeStyle='#7a520f';cx.lineWidth=1.2;cx.stroke();cx.restore();}
    else{q.o+=.05;q.x+=q.vx+Math.sin(q.o)*1.2;q.y+=q.vy;q.a+=q.va;
      cx.save();cx.translate(q.x,q.y);cx.rotate(q.a);cx.scale(1,Math.abs(Math.cos(q.o*1.7))+.2);cx.fillStyle=q.c;cx.fillRect(-q.r,-q.r*.4,q.r*2,q.r*.8);cx.restore();}});
  pezzi=pezzi.filter(q=>q.y<innerHeight+40&&q.vita<900);
  if(pezzi.length)requestAnimationFrame(passo);else{vivo=false;cx.clearRect(0,0,innerWidth,innerHeight);}}

let musica=null,folla=null;
function jackpot(){
  macchina.classList.add('festa');
  suona('rivela',{vol:1});suona('campanella',{vol:.7,ritardo:.15});
  [0,.25,.5,.8,1.1,1.5].forEach((r,i)=>suona(i%2?'sacco':'monete',{vol:.7,vel:.95+Math.random()*.1,ritardo:r}));
  folla=suona('folla',{vol:.55,ritardo:.5});sfuma(folla,4.5,2.5);
  if(!ridotto){monete(40);setTimeout(()=>monete(40),500);setTimeout(()=>monete(30),1000);coriandoli(160);}
  setTimeout(()=>mostraRivela('Devi fare il regalo a',true),2600);
}
const rivela=document.getElementById('rivela');
function mostraRivela(testo,conMusica){
  document.getElementById('etich').textContent=testo;
  const gig=document.getElementById('gigante');gig.textContent='';gig.style.backgroundImage='url("'+SS.foto(P[bersaglio])+'")';
  document.getElementById('nome-grande').innerHTML=[...P[bersaglio]].map((c,i)=>'<span style="animation-delay:'+(0.9+i*0.08)+'s">'+c+'</span>').join('');
  rivela.classList.add('attivo');
  if(conMusica){musica=suona('musica',{vol:.45,ritardo:.4});if(!ridotto)setTimeout(()=>coriandoli(120),900);}
}

// ===== collegamento con lo script =====
const sottotitolo=document.getElementById('sottotitolo'),tira=document.getElementById('tira');
const testoInvito=()=>(io?io.nome+', ':'')+'la sorte ha già deciso. Puoi anche trascinare giù la leva rossa.';
function carica(){
  tira.disabled=true;sottotitolo.textContent='Un attimo, sto chiedendo alla sorte…';
  SS.api('stato').then(s=>{
    bersaglio=P.indexOf(s.destinatario);
    if(bersaglio<0)throw new Error('Sorteggio non disponibile. Riprova tra poco.');
    tira.disabled=false;sottotitolo.textContent=testoInvito();
    if(s.visto){                                     // dal secondo accesso: la faccia subito
      [0,1,2].forEach(k=>posa(k,bersaglio));fatto=true;
      setTimeout(()=>mostraRivela('Il tuo regalo è per',false),300);
    }
  }).catch(e=>{
    sottotitolo.textContent=e.message+' Tocca il pulsante per riprovare.';
    tira.disabled=false;tira.textContent='Riprova';tira.onclick=()=>location.reload();
  });
}
carica();
document.getElementById('home').addEventListener('click',()=>location.href='home.html');
// dopo la vincita: lo script ricorda che hai visto il sorteggio
const _j=jackpot;jackpot=function(){_j();fatto=true;inCorso=false;SS.api('visto').catch(()=>{});};
</script>
